<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#44546A"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="460" fill="#FFFFFF"/>

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">ClickFix Attack Chain</text>
  <text x="600" y="56" text-anchor="middle" font-size="14" fill="#666666">Delivery through blocked execution</text>

  <!-- Step 1 -->
  <rect x="20" y="140" width="170" height="110" rx="8" fill="#EEF1F6" stroke="#1F3864" stroke-width="1.5"/>
  <text x="105" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">STEP 1</text>
  <text x="105" y="192" text-anchor="middle" font-size="13" fill="#222222">Malicious or</text>
  <text x="105" y="208" text-anchor="middle" font-size="13" fill="#222222">compromised webpage</text>
  <text x="105" y="228" text-anchor="middle" font-size="11" fill="#666666">fake CAPTCHA / error prompt</text>

  <line x1="190" y1="195" x2="230" y2="195" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="232" y="140" width="170" height="110" rx="8" fill="#EEF1F6" stroke="#1F3864" stroke-width="1.5"/>
  <text x="317" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">STEP 2</text>
  <text x="317" y="192" text-anchor="middle" font-size="13" fill="#222222">Clipboard hijacked</text>
  <text x="317" y="208" text-anchor="middle" font-size="13" fill="#222222">via JavaScript</text>
  <text x="317" y="228" text-anchor="middle" font-size="11" fill="#666666">command written silently</text>

  <line x1="402" y1="195" x2="442" y2="195" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="444" y="140" width="170" height="110" rx="8" fill="#EEF1F6" stroke="#1F3864" stroke-width="1.5"/>
  <text x="529" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">STEP 3</text>
  <text x="529" y="192" text-anchor="middle" font-size="13" fill="#222222">User pastes into Run</text>
  <text x="529" y="208" text-anchor="middle" font-size="13" fill="#222222">Win+R, paste, Enter</text>
  <text x="529" y="228" text-anchor="middle" font-size="11" fill="#666666">explorer.exe initiates</text>

  <line x1="614" y1="195" x2="654" y2="195" stroke="#44546A" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="656" y="140" width="170" height="110" rx="8" fill="#EEF1F6" stroke="#1F3864" stroke-width="1.5"/>
  <text x="741" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">STEP 4</text>
  <text x="741" y="192" text-anchor="middle" font-size="13" fill="#222222">powershell.exe launches</text>
  <text x="741" y="208" text-anchor="middle" font-size="13" fill="#222222">obfuscated one-liner</text>
  <text x="741" y="228" text-anchor="middle" font-size="11" fill="#666666">-ep bypass -w hidden</text>

  <line x1="826" y1="195" x2="866" y2="195" stroke="#B03A2E" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <!-- Step 5: Blocked -->
  <rect x="868" y="130" width="180" height="130" rx="8" fill="#FBEAEA" stroke="#B03A2E" stroke-width="2"/>
  <text x="958" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#B03A2E">BLOCKED HERE</text>
  <text x="958" y="180" text-anchor="middle" font-size="13" fill="#222222">Attempted fetch to</text>
  <text x="958" y="196" text-anchor="middle" font-size="13" fill="#222222">payload host</text>
  <text x="958" y="216" text-anchor="middle" font-size="11" fill="#666666">Invoke-RestMethod call</text>
  <text x="958" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#B03A2E">AntivirusDetection</text>
  <text x="958" y="248" text-anchor="middle" font-size="10" fill="#666666">signature-based</text>

  <line x1="1048" y1="195" x2="1088" y2="195" stroke="#999999" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Step 6: Never reached -->
  <rect x="1090" y="150" width="100" height="90" rx="8" fill="#F5F5F5" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="1140" y="180" text-anchor="middle" font-size="11" fill="#999999">Payload</text>
  <text x="1140" y="196" text-anchor="middle" font-size="11" fill="#999999">execution</text>
  <text x="1140" y="216" text-anchor="middle" font-size="10" font-style="italic" fill="#AAAAAA">never reached</text>

  <!-- Verification bar -->
  <rect x="20" y="300" width="1170" height="130" rx="8" fill="#F7F8FA" stroke="#CCCCCC" stroke-width="1"/>
  <text x="40" y="326" font-size="13" font-weight="bold" fill="#1F3864">Independently verified across four telemetry sources:</text>

  <rect x="40" y="344" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
  <text x="175" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">DeviceNetworkEvents</text>
  <text x="175" y="386" text-anchor="middle" font-size="11" fill="#444444">zero connections found</text>

  <rect x="330" y="344" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
  <text x="465" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">DeviceEvents</text>
  <text x="465" y="386" text-anchor="middle" font-size="11" fill="#444444">AntivirusDetection confirmed</text>

  <rect x="620" y="344" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
  <text x="755" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">DeviceFileEvents</text>
  <text x="755" y="386" text-anchor="middle" font-size="11" fill="#444444">no files written</text>

  <rect x="910" y="344" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
  <text x="1040" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F3864">Fleet-wide hunt</text>
  <text x="1040" y="386" text-anchor="middle" font-size="11" fill="#444444">isolated, no other devices</text>
</svg>
